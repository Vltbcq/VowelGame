name: Release

# Exporte le jeu (Windows) sur les serveurs de GitHub et publie une Release avec le .exe et le zip.
# - Automatique : quand un tag de version est poussé (v0.2, v0.3, v1.0...)
# - À la main : onglet Actions > Release > Run workflow (tu saisis la version)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Numéro de version (ex. v0.3)"
        required: true

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tout l'historique et les tags, pour le changelog

      - name: Télécharger Godot et les modèles d'export
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Importer le projet
        run: timeout 300 "$RUNNER_TEMP/godot" --headless --path . --import || true

      - name: Vérifier que tous les scripts compilent
        run: |
          timeout 300 "$RUNNER_TEMP/godot" --headless --path . res://tests/checkall.tscn 2>&1 | tee checkall.log
          grep -q "0 en erreur" checkall.log

      - name: Exporter le jeu (Windows)
        run: |
          mkdir -p builds
          timeout 600 "$RUNNER_TEMP/godot" --headless --path . --export-release "Windows Desktop" builds/Vowel.exe
          test -s builds/Vowel.exe
          cd builds && zip -q Vowel-windows.zip Vowel.exe && ls -la

      - name: Écrire le changelog (commits depuis la version précédente)
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          PREV=$(git tag --list 'v*' --sort=-creatordate | grep -vx "$VERSION" | head -n1 || true)
          RANGE="HEAD"
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; fi
          {
            echo "## Nouveautés"
            if [ -n "$PREV" ]; then echo "_Depuis la ${PREV}_"; fi
            echo
            for c in $(git rev-list --no-merges "$RANGE"); do
              echo "- **$(git log -1 --format=%s "$c")**"
              git log -1 --format=%b "$c" | grep -v '^Co-Authored-By' | sed '/^[[:space:]]*$/d; s/^/  /'
            done
            echo
            echo "## Jouer"
            echo "Télécharge \`Vowel.exe\` (ou \`Vowel-windows.zip\`, plus léger) et lance-le."
            echo "Windows peut afficher « Windows a protégé votre PC » : *Informations complémentaires* → *Exécuter quand même*."
          } > CHANGELOG_RELEASE.md
          cat CHANGELOG_RELEASE.md

      - name: Publier la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Vowel ${{ github.event.inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          body_path: CHANGELOG_RELEASE.md
          files: |
            builds/Vowel.exe
            builds/Vowel-windows.zip
